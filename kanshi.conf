# kanshi — output profiles, matched by monitor make/model/serial
# (not by connector name, which changes between machines and ports).
#
# Find your monitors' descriptions with:
#   swaymsg -t get_outputs | jq -r '.[] | "\(.make) \(.model) \(.serial)"'
#
# If no profile matches (e.g. on a different PC), kanshi does nothing and
# sway uses each monitor's preferred mode at scale 1.
#
# Keep the laptop panel at 0,0: flameshot misplaces its overlay when the
# focused output isn't at the origin.

# MSI GS66 alone
profile gs66 {
    output "Sharp Corporation LQ156T1JW04 Unknown" mode 2560x1440@239.972Hz scale 1.25 position 0,0
}

# MSI GS66 + LG UltraWide above it, centred
profile gs66-lg {
    output "Sharp Corporation LQ156T1JW04 Unknown" mode 2560x1440@239.972Hz scale 1.25 position 0,0
    output "LG Electronics LG ULTRAWIDE 0x00054C91" mode 2560x1080 scale 1 position -256,-1080
}
